<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un detalle para ti</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #160826, #3b1b69, #5c62a8);
      background-size: 200% 200%;
      animation: gradientBg 12s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    @keyframes gradientBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    /* Carta Inicial */
    .card {
      text-align: center;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 45px 30px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: opacity 0.8s ease, transform 0.8s ease;
      z-index: 20;
    }

    .message {
      font-family: 'Great Vibes', cursive;
      font-size: 2.6rem;
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
      margin-bottom: 32px;
      line-height: 1.3;
    }

    button {
      background: linear-gradient(45deg, #ffe600, #ffa200);
      color: #240a42;
      border: none;
      padding: 15px 38px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(255, 230, 0, 0.4);
      transition: all 0.35s ease;
    }

    button:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 12px 28px rgba(255, 230, 0, 0.6);
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.9);
    }

    /* Contenedor del Ramo */
    .flower-container {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 80px;
      transition: opacity 1s ease;
    }

    .bouquet {
      position: relative;
      width: 300px;
      height: 420px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      transform-origin: bottom center;
    }

    /* Animación de suave balanceo del ramo */
    .flower-container.active .bouquet {
      animation: gentleSway 5s ease-in-out infinite alternate 2.8s;
    }

    @keyframes gentleSway {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2deg); }
    }

    /* Tallos */
    .stem {
      position: absolute;
      bottom: 40px;
      width: 7px;
      background: linear-gradient(to top, #1e4d2b, #43a047);
      border-radius: 4px;
      height: 0;
      transform-origin: bottom center;
      transition: height 1.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Distribución limpia y separada para no empalmarse */
    .s1 { transform: rotate(-28deg); left: 42%; }
    .s2 { transform: rotate(-14deg); left: 46%; }
    .s3 { transform: rotate(0deg);   left: 50%; }
    .s4 { transform: rotate(14deg);  left: 54%; }
    .s5 { transform: rotate(28deg);  left: 58%; }

    .flower-container.active .s1 { height: 230px; }
    .flower-container.active .s2 { height: 270px; }
    .flower-container.active .s3 { height: 310px; }
    .flower-container.active .s4 { height: 270px; }
    .flower-container.active .s5 { height: 230px; }

    /* Hojas en los tallos */
    .leaf {
      position: absolute;
      width: 20px;
      height: 10px;
      background: #43a047;
      border-radius: 10px 0 10px 0;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .s1 .leaf { top: 40%; left: -16px; transform: rotate(-20deg); }
    .s3 .leaf { top: 50%; right: -16px; transform: rotate(40deg) scaleX(-1); }
    .s5 .leaf { top: 40%; right: -16px; transform: rotate(20deg) scaleX(-1); }

    .flower-container.active .leaf {
      opacity: 1;
      transition-delay: 1.2s;
    }

    /* Flores de Pétalos Reales */
    .flower {
      position: absolute;
      top: 0;
      left: 50%;
      width: 70px;
      height: 70px;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Tiempos de apertura escalonados */
    .flower-container.active .s3 .flower { transform: translate(-50%, -50%) scale(1); transition-delay: 1.2s; }
    .flower-container.active .s2 .flower { transform: translate(-50%, -50%) scale(0.95); transition-delay: 1.4s; }
    .flower-container.active .s4 .flower { transform: translate(-50%, -50%) scale(0.95); transition-delay: 1.5s; }
    .flower-container.active .s1 .flower { transform: translate(-50%, -50%) scale(0.9); transition-delay: 1.7s; }
    .flower-container.active .s5 .flower { transform: translate(-50%, -50%) scale(0.9); transition-delay: 1.8s; }

    /* Centro de la Flor */
    .center-dot {
      position: absolute;
      width: 22px;
      height: 22px;
      background: radial-gradient(circle, #54320e 0%, #2b1704 100%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.6), 0 0 6px rgba(0,0,0,0.3);
    }

    /* Pétalos amarillos */
    .petals-group {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    .petal {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 13px;
      height: 32px;
      background: linear-gradient(to top, #ffcc00, #ffee55);
      border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
      transform-origin: center bottom;
      margin-left: -6.5px;
      margin-top: -32px;
      box-shadow: 0 0 6px rgba(255, 215, 0, 0.5);
    }

    /* Rotación individual de los 12 pétalos de cada flor */
    .p1  { transform: rotate(0deg); }
    .p2  { transform: rotate(30deg); }
    .p3  { transform: rotate(60deg); }
    .p4  { transform: rotate(90deg); }
    .p5  { transform: rotate(120deg); }
    .p6  { transform: rotate(150deg); }
    .p7  { transform: rotate(180deg); }
    .p8  { transform: rotate(210deg); }
    .p9  { transform: rotate(240deg); }
    .p10 { transform: rotate(270deg); }
    .p11 { transform: rotate(300deg); }
    .p12 { transform: rotate(330deg); }

    /* Lazo elegante del ramo */
    .ribbon-wrap {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      z-index: 10;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .flower-container.active .ribbon-wrap {
      transform: translateX(-50%) scale(1);
      transition-delay: 2.2s;
    }

    .ribbon-knot {
      width: 22px;
      height: 18px;
      background: #e63946;
      border-radius: 4px;
      margin: 0 auto;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .ribbon-tails {
      display: flex;
      justify-content: center;
      gap: 4px;
    }

    .tail {
      width: 8px;
      height: 25px;
      background: #c1121f;
      border-radius: 0 0 4px 4px;
    }
    .t1 { transform: rotate(15deg); }
    .t2 { transform: rotate(-15deg); }

    /* Destellos de luz flotando */
    .sparkles {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease 2.5s;
    }

    .flower-container.active .sparkles { opacity: 1; }

    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffe600, 0 0 20px #ffe600;
      animation: floatSparkle 4s ease-in-out infinite alternate;
    }

    .sp1 { top: 30%; left: 20%; animation-delay: 0s; }
    .sp2 { top: 20%; right: 25%; animation-delay: 1s; }
    .sp3 { top: 40%; right: 15%; animation-delay: 2s; }
    .sp4 { top: 15%; left: 35%; animation-delay: 1.5s; }

    @keyframes floatSparkle {
      0% { transform: translateY(0) scale(0.8); opacity: 0.3; }
      100% { transform: translateY(-20px) scale(1.3); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Pantalla inicial -->
    <div id="intro-card" class="card">
      <p class="message">No es mucho pero es mi detalle para ti.</p>
      <button id="open-btn" onclick="openGift()">Abrir regalo</button>
    </div>

    <!-- Pantalla del ramo de flores -->
    <div id="flower-container" class="flower-container hidden">
      <div class="sparkles">
        <div class="sparkle sp1"></div>
        <div class="sparkle sp2"></div>
        <div class="sparkle sp3"></div>
        <div class="sparkle sp4"></div>
      </div>

      <div class="bouquet">
        <!-- Tallo 1 (Izquierda ext.) -->
        <div class="stem s1">
          <div class="leaf"></div>
          <div class="flower">
            <div class="center-dot"></div>
            <div class="petals-group">
              <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
              <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
              <div class="petal p7"></div><div class="petal p8"></div><div class="petal p9"></div>
              <div class="petal p10"></div><div class="petal p11"></div><div class="petal p12"></div>
            </div>
          </div>
        </div>

        <!-- Tallo 2 (Izquierda int.) -->
        <div class="stem s2">
          <div class="flower">
            <div class="center-dot"></div>
            <div class="petals-group">
              <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
              <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
              <div class="petal p7"></div><div class="petal p8"></div><div class="petal p9"></div>
              <div class="petal p10"></div><div class="petal p11"></div><div class="petal p12"></div>
            </div>
          </div>
        </div>

        <!-- Tallo 3 (Centro alto) -->
        <div class="stem s3">
          <div class="leaf"></div>
          <div class="flower">
            <div class="center-dot"></div>
            <div class="petals-group">
              <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
              <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
              <div class="petal p7"></div><div class="petal p8"></div><div class="petal p9"></div>
              <div class="petal p10"></div><div class="petal p11"></div><div class="petal p12"></div>
            </div>
          </div>
        </div>

        <!-- Tallo 4 (Derecha int.) -->
        <div class="stem s4">
          <div class="flower">
            <div class="center-dot"></div>
            <div class="petals-group">
              <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
              <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
              <div class="petal p7"></div><div class="petal p8"></div><div class="petal p9"></div>
              <div class="petal p10"></div><div class="petal p11"></div><div class="petal p12"></div>
            </div>
          </div>
        </div>

        <!-- Tallo 5 (Derecha ext.) -->
        <div class="stem s5">
          <div class="leaf"></div>
          <div class="flower">
            <div class="center-dot"></div>
            <div class="petals-group">
              <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
              <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
              <div class="petal p7"></div><div class="petal p8"></div><div class="petal p9"></div>
              <div class="petal p10"></div><div class="petal p11"></div><div class="petal p12"></div>
            </div>
          </div>
        </div>

        <!-- Lazo/Listón -->
        <div class="ribbon-wrap">
          <div class="ribbon-knot"></div>
          <div class="ribbon-tails">
            <div class="tail t1"></div>
            <div class="tail t2"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    function openGift() {
      const card = document.getElementById('intro-card');
      const flowerContainer = document.getElementById('flower-container');
      
      card.classList.add('hidden');
      
      setTimeout(() => {
        card.style.display = 'none';
        flowerContainer.classList.remove('hidden');
        flowerContainer.classList.add('active');
      }, 800);
    }
  </script>
</body>
</html>
